<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>达尔肤 - 618福利加码</title>
<style>:root{--bg:#0d1117;--card-bg:#161b22;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--border:#30363d}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:16px;line-height:1.5}.header{text-align:center;padding:24px 0 16px;border-bottom:1px solid var(--border);margin-bottom:20px}.header h1{font-size:20px;color:var(--accent);margin-bottom:4px}.header .meta{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stage{grid-column:1/-1;color:var(--accent);font-size:13px;font-weight:600;padding:12px 0 4px;margin-top:8px;border-top:1px solid var(--border)}.card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:transform .15s}.card:hover{transform:translateY(-2px)}.time{font-size:11px;color:var(--accent);padding:6px 8px 0;font-weight:600}.text{font-size:13px;color:var(--text);padding:4px 8px 6px;line-height:1.4;min-height:20px}.card img{width:100%;display:block}@media(min-width:768px){body{max-width:960px;margin:0 auto;padding:24px}.grid{grid-template-columns:repeat(3,1fr);gap:12px}}</style></head><body>
<div class="header"><h1>达尔肤 - 618福利加码</h1><div class="meta">8 frames</div></div>
<div class="grid"><div class="stage">第1段 (2.7s)</div><div class="card"><div class="time">2.7s</div><div class="text">五弟妈第一次在直播间听到这么小众的词啊</div><img src="frame_001.jpg" loading="lazy"></div>
<div class="card"><div class="time">17.0s</div><div class="text">是说蝶子显得可爱吗</div><img src="frame_002.jpg" loading="lazy"></div>
<div class="stage">第2段 (18.4s)</div><div class="card"><div class="time">18.4s</div><div class="text">看了他家直播我才明白</div><img src="frame_003.jpg" loading="lazy"></div>
<div class="card"><div class="time">21.2s</div><div class="text">别人跟你说什么戏什么毛小孔</div><img src="frame_004.jpg" loading="lazy"></div>
<div class="stage">第3段 (57.5s)</div><div class="card"><div class="time">57.5s</div><div class="text">你想想定是用多少瓶瓶灌灌</div><img src="frame_005.jpg" loading="lazy"></div>
<div class="card"><div class="time">63.2s</div><div class="text">现在还有六一八大速重粉浮力</div><img src="frame_006.jpg" loading="lazy"></div>
<div class="stage">第4段 (65.2s)</div><div class="card"><div class="time">65.2s</div><div class="text">三百多拍一发十六</div><img src="frame_007.jpg" loading="lazy"></div>
<div class="card"><div class="time">67.2s</div><div class="text">都是好 你说多少啊</div><img src="frame_008.jpg" loading="lazy"></div></div></body></html>
