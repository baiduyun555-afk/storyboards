<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海王金樽 截图分镜</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#111;color:#eee;padding:12px}
h1{text-align:center;color:#4da6ff;font-size:18px;margin-bottom:12px}
.stage{color:#4da6ff;font-size:13px;margin:16px 0 6px;border-left:3px solid #4da6ff;padding-left:8px;grid-column:1/-1}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{background:#1a1a1a;border-radius:8px;padding:6px}
.time{color:#888;font-size:11px}.text{font-size:13px;margin:3px 0 5px;line-height:1.3}
.card img{width:100%;border-radius:4px;display:block}
@media(min-width:768px){body{max-width:900px;margin:0 auto}.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<h1>海王金樽 截图分镜</h1>
<div class="grid">

</div>
</body></html>
