<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酒局救星 截图分镜</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#111;color:#eee;padding:12px}
h1{text-align:center;color:#4da6ff;font-size:18px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{background:#1a1a1a;border-radius:8px;padding:6px}
.card img{width:100%;border-radius:4px;display:block}
.frame-num{color:#888;font-size:11px}
@media(min-width:768px){body{max-width:900px;margin:0 auto}.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<h1>酒局救星 截图分镜</h1>
<div class="grid">
<div class="card"><div class="frame-num">#001</div><img src="frame_001.jpg" loading="lazy"></div>
<div class="card"><div class="frame-num">#002</div><img src="frame_002.jpg" loading="lazy"></div>
<div class="card"><div class="frame-num">#003</div><img src="frame_003.jpg" loading="lazy"></div>
<div class="card"><div class="frame-num">#004</div><img src="frame_004.jpg" loading="lazy"></div>
<div class="card"><div class="frame-num">#005</div><img src="frame_005.jpg" loading="lazy"></div>
<div class="card"><div class="frame-num">#006</div><img src="frame_006.jpg" loading="lazy"></div>
<div class="card"><div class="frame-num">#007</div><img src="frame_007.jpg" loading="lazy"></div>
<div class="card"><div class="frame-num">#008</div><img src="frame_008.jpg" loading="lazy"></div>
</div>
</body></html>
