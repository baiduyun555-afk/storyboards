<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>酒局救星</title>

    <style>
    :root {
        --bg: #0d1117;
        --card-bg: #161b22;
        --text: #c9d1d9;
        --muted: #8b949e;
        --accent: #58a6ff;
        --border: #30363d;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:16px;line-height:1.5}
    .header{text-align:center;padding:24px 0 16px;border-bottom:1px solid var(--border);margin-bottom:20px}
    .header h1{font-size:20px;color:var(--accent);margin-bottom:4px}
    .header .meta{font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .stage{grid-column:1/-1;color:var(--accent);font-size:13px;font-weight:600;padding:12px 0 4px;margin-top:8px;border-top:1px solid var(--border);letter-spacing:0.5px}
    .card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:transform .15s}
    .card:hover{transform:translateY(-2px)}
    .time{font-size:11px;color:var(--accent);padding:6px 8px 0;font-weight:600;font-variant-numeric:tabular-nums}
    .text{font-size:13px;color:var(--text);padding:4px 8px 6px;line-height:1.4;min-height:20px}
    .card img{width:100%;display:block}
    .footer{text-align:center;padding:20px;color:var(--muted);font-size:11px}
    @media(min-width:768px){body{max-width:960px;margin:0 auto;padding:24px}.grid{grid-template-columns:repeat(3,1fr);gap:12px}}
    </style>
    
</head>
<body>
